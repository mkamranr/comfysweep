    <path d="M40 51 L47 44 L54 51"/>
  </g>
  <circle cx="40" cy="51" r="3.2" fill="#fff"/>
  <circle cx="47" cy="44" r="3.2" fill="#fff"/>
  <circle cx="54" cy="51" r="3.2" fill="#fff"/>
