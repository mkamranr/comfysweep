name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t comfysweep:ci .

      - name: Self-test inside the container
        run: |
          mkdir -p "$RUNNER_TEMP/host/ComfyUI/output" "$RUNNER_TEMP/data"
          docker run --rm \
            -v "$RUNNER_TEMP/host:/host" -v "$RUNNER_TEMP/data:/data" \
            comfysweep:ci python -m app.cli selftest

      - name: Container starts and answers /api/ping
        run: |
          docker run -d --name comfysweep-ci -p 8191:8191 \
            -v "$RUNNER_TEMP/host:/host" -v "$RUNNER_TEMP/data:/data" \
            comfysweep:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8191/api/ping; then echo; exit 0; fi
            sleep 1
          done
          docker logs comfysweep-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs comfysweep-ci || true

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
