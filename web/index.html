<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComfySweep</title>
  <meta name="description" content="ComfySweep — the ComfyUI Cleaner Agent">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { var t = localStorage.getItem("cs-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <!-- Signed-out screens (login + first-run setup) -->
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="brand brand-lg">
        <img src="/logo.svg" alt="" width="52" height="52">
        <div>
          <div class="wordmark">Comfy<span>Sweep</span></div>
          <div class="tagline">The ComfyUI Cleaner Agent</div>
        </div>
      </div>
      <div id="gate-body"></div>
    </div>
  </div>

  <!-- Signed-in application shell -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/dashboard">
        <img src="/logo.svg" alt="" width="36" height="36">
        <div class="wordmark">Comfy<span>Sweep</span></div>
      </a>
      <nav class="nav">
        <a href="#/dashboard" data-nav="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>Dashboard</a>
        <a href="#/history" data-nav="history"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L9 12H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/></svg>History</a>
        <a href="#/logs" data-nav="logs"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 4h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg>Logs</a>
        <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div id="side-status" class="side-status"></div>
        <div class="side-user">
          <span id="who" class="who"></span>
          <button class="icon-btn" id="theme-btn" title="Toggle light / dark">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          </button>
          <button class="icon-btn" id="logout-btn" title="Sign out">
            <svg viewBox="0 0 24 24"><path d="M10 17l1.41-1.41L8.83 13H20v-2H8.83l2.58-2.59L10 7l-5 5zM4 5h8V3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8v-2H4z"/></svg>
          </button>
        </div>
        <div class="version" id="version"></div>
      </div>
    </aside>
    <main class="main">
      <div id="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
